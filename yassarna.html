<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>يَسَّرْنَا · نموذج تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri+Quran&family=El+Messiri:wght@600;700&family=Noto+Kufi+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
:root{--teal:#1F4A55;--green:#41766F;--sage:#84A59D;--gold:#F6BD60;--cream:#F7EDE2;--coral:#F28482;--blush:#F5CAC3;--amber:#E09453;--rust:#A34828;--ink:#1F4A55;--muted:#55686C;--line:#E6DCCF;--white:#FFFFFF;--goodbg:#E4EFEC}
*{box-sizing:border-box}
html,body{margin:0;background:#EDE4D8;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--teal);color:var(--cream)}
.topbar h1{margin:0;font-size:18px;font-weight:600}
.topbar .note{font-size:12.5px;color:#C9D6D2}
.modes{display:flex;gap:6px;background:rgba(255,255,255,.08);padding:4px;border-radius:12px}
.modes button{border:0;background:transparent;color:var(--cream);padding:9px 16px;border-radius:9px;font-size:14px;font-weight:600;min-height:40px}
.modes button.on{background:var(--gold);color:var(--teal)}
.stage{display:flex;justify-content:center;padding:28px 16px 48px}
.phone{width:390px;height:812px;background:var(--cream);border-radius:44px;border:10px solid #1B1B1B;box-shadow:0 18px 50px rgba(31,74,85,.25);overflow:hidden;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:18px 18px 24px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.brand{display:flex;align-items:center;gap:8px;line-height:1.6;font-family:'El Messiri',serif;font-weight:700;font-size:22px;color:var(--teal)}
.tempmark{width:30px;height:30px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center}
.tempmark i{width:14px;height:6px;border-radius:3px;background:var(--gold);display:block}
.lvlpill{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--teal);color:var(--cream);font-size:17px;font-weight:600}
.btn:disabled{background:#B9C4C2;cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--teal);border:1.5px solid var(--teal)}
.btn.gold{background:var(--gold);color:var(--teal)}
.link{background:none;border:0;color:var(--green);font-size:15px;font-weight:600;padding:10px;min-height:44px}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px}
.h2{font-size:22px;font-weight:700;margin:6px 0 4px}
.sub{font-size:14px;color:var(--muted);margin:0 0 16px;line-height:1.6}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:14px;font-size:16px;margin-bottom:10px;min-height:54px;color:var(--ink)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--sage);flex:none}
.opt.sel{border-color:var(--teal);background:#EEF4F2}
.opt.sel .dot{border:7px solid var(--teal)}
.opt.right{border-color:var(--green);background:var(--goodbg)}
.opt.wrong{border-color:var(--coral);background:#FDECEA}
.opt small{display:block;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:9px 14px;font-size:14.5px;min-height:42px;color:var(--ink)}
.chip.sel{background:var(--teal);color:var(--cream);border-color:var(--teal)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stepper{display:flex;gap:6px;margin-bottom:14px}
.stepper i{flex:1;height:6px;border-radius:3px;background:#E3D8CA;display:block}
.stepper i.on{background:var(--green)}
.bar{height:10px;background:#E3D8CA;border-radius:6px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--green);border-radius:6px}
.bar.gold b{background:var(--gold)}
.loc{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ayah{background:linear-gradient(180deg,#EAF2EF,#F9F6F1);border:1px solid #D6E3DE;border-radius:18px;padding:18px 14px;text-align:center;font-family:'Amiri Quran','Amiri',serif;font-size:26px;line-height:2.1;color:#173A43}
.ayah mark{background:var(--gold);color:var(--teal);border-radius:10px;padding:0 6px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--goodbg);color:var(--teal);display:inline-flex;align-items:center;justify-content:center}
.q{font-size:19px;font-weight:700;text-align:center;margin:16px 0 12px}
.blank{display:inline-block;min-width:80px;border-bottom:2.5px solid var(--gold);color:var(--green);padding:0 6px}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.match button{min-height:52px;border:1.5px solid var(--line);background:var(--white);border-radius:14px;font-size:15px;padding:8px;color:var(--ink)}
.match .w{font-family:'Amiri Quran','Amiri',serif;font-size:20px}
.match button.sel{border-color:var(--teal);background:#EEF4F2}
.match button.done{border-color:var(--green);background:var(--goodbg);color:var(--green)}
.match button.bad{border-color:var(--coral);background:#FDECEA}
.fb{border-radius:20px;padding:16px;margin-top:12px}
.fb.ok{background:var(--goodbg);border:1px solid #C8DCD6}
.fb.no{background:#FDF1EE;border:1px solid var(--blush)}
.fb h3{margin:0 0 6px;font-size:20px}
.fb.ok h3{color:var(--green)}
.fb.no h3{color:var(--rust)}
.fb p{margin:4px 0;font-size:14.5px;line-height:1.7}
.src{font-size:12px;color:var(--muted)}
.foot{padding:12px 18px 18px;background:var(--cream);border-top:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--white);border-top:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 4px 14px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:60px}
.tabs button.on{color:var(--teal);font-weight:700}
.tabs svg{width:22px;height:22px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.stats div+div{border-right:1px solid var(--line)}
.stats b{display:block;font-size:20px}
.stats span{font-size:12.5px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.week{display:flex;justify-content:space-between}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.week i{width:26px;height:26px;border-radius:50%;border:2px solid #D9CFC2;display:block}
.week i.on{background:var(--green);border-color:var(--green)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border:0}
.badge{width:40px;height:40px;border-radius:12px;background:var(--goodbg);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--teal);color:var(--cream);padding:12px 14px;border-radius:14px;font-size:14px;text-align:center;z-index:20}
.seg{display:flex;background:#EFE6DA;border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:40px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--white);color:var(--teal)}
.lb .item.me{background:#FFF6E5;border-radius:12px;padding-inline:8px}
.notice{background:#FFF6E5;border:1px solid #F3DDAE;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.6}
.big{font-size:44px;font-weight:700;color:var(--teal);text-align:center;margin:4px 0}
.center{text-align:center}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;background:var(--teal);color:var(--cream);text-align:center}
.splash .name{font-family:'El Messiri',serif;font-size:54px;font-weight:700}
.splash .ayahs{font-family:'Amiri Quran','Amiri',serif;font-size:22px;line-height:2;color:var(--gold)}
.homesc{flex:1;background:linear-gradient(160deg,#2F6470,#1F4A55 60%,#173A43);padding:56px 20px 20px;display:flex;flex-direction:column;gap:16px}
.appgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 10px}
.appgrid span{aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.18);display:block}
.widget{background:var(--cream);border-radius:24px;padding:14px;color:var(--ink)}
.notif{background:rgba(255,255,255,.92);border-radius:18px;padding:12px;color:var(--ink);font-size:14px}
.notif .acts{display:flex;gap:6px;margin-top:8px}
.notif .acts button{flex:1;border:0;border-radius:10px;background:#EEF4F2;min-height:40px;font-size:13.5px;color:var(--teal)}
.lvl-burst{width:120px;height:120px;border-radius:50%;margin:8px auto;background:radial-gradient(circle,#FFF3D9 0,#F6BD60 70%);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--teal)}
.otp{display:flex;gap:10px;justify-content:center;direction:ltr}
.otp input{width:56px;height:60px;text-align:center;font-size:24px;border:1.5px solid var(--line);border-radius:14px}
.field{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font-size:16px;background:var(--white)}
label.lbl{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
/* portal */
.portal{max-width:1280px;margin:24px auto;background:var(--white);border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(31,74,85,.12);display:flex;flex-wrap:wrap;min-height:760px}
.side{flex:0 0 240px;background:var(--teal);color:var(--cream);padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.side .who{font-size:13px;color:#C9D6D2;margin:2px 0 16px}
.side button{border:0;background:none;color:var(--cream);text-align:start;padding:11px 12px;border-radius:10px;font-size:15px;min-height:44px}
.side button.on{background:rgba(246,189,96,.18);color:var(--gold);font-weight:700}
.main{flex:999 1 600px;min-width:0;padding:26px 30px;background:#FBF8F3}
.main h2{margin:0 0 4px;font-size:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-size:26px;margin-top:4px}
.kpi span{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#F4EEE5;font-size:13px;color:var(--muted);font-weight:600}
tr:last-child td{border:0}
.mini{display:inline-block;width:110px;vertical-align:middle;margin-inline-start:8px}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.tag.ok{background:var(--goodbg);color:var(--green)}
.tag.warn{background:#FFF1D6;color:#8A5A0B}
.tag.bad{background:#FDE7E4;color:var(--rust)}
.cols{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px}
.cols>*{flex:1 1 320px;min-width:0}
.pbtn{border:0;border-radius:12px;background:var(--teal);color:var(--cream);padding:0 18px;min-height:44px;font-size:15px;font-weight:600}
.pbtn.ghost{background:var(--white);color:var(--teal);border:1.5px solid var(--teal)}
.code{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:4px;background:#FFF6E5;border:1px dashed var(--gold);border-radius:12px;padding:8px 14px;display:inline-block;direction:ltr}
.disclaimer{max-width:1280px;margin:0 auto 30px;padding:0 16px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
@media (max-width:460px){.phone{width:100%;height:760px;border-width:6px;border-radius:30px}.stage{padding:12px 6px}}
.qa{direction:rtl;unicode-bidi:isolate}
.qinline{unicode-bidi:isolate}
.langpick{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px}
.langsw{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:12px}
.langsw button{border:0;background:transparent;color:var(--cream);padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:600;min-height:40px}
.langsw button.on{background:var(--cream);color:var(--teal)}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-46px);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-8deg)}60%{transform:translateY(0) rotate(5deg)}}
@keyframes droop{to{transform:rotate(9deg) translateY(4px)}}
@keyframes crest{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes conf{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(840px) rotate(720deg)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glowok{0%{box-shadow:0 0 0 0 rgba(65,118,111,.5)}100%{box-shadow:0 0 0 14px rgba(65,118,111,0)}}
.fb{animation:pop .35s ease-out;position:relative}
.shake{animation:shake .4s}
.opt.right,.wbtn.right{animation:glowok .7s}
.xpfloat{position:absolute;top:-6px;inset-inline-end:16px;font-weight:700;color:#B27A12;animation:floatUp 1.1s ease-out forwards}
.mascot{display:flex;align-items:flex-end;gap:8px;margin:2px 0 10px}
.hoopoe{display:inline-block;flex:none;transform-origin:50% 90%}
.hoopoe.m-idle{animation:bob 2.6s ease-in-out infinite}
.hoopoe.m-happy{animation:jump .7s ease-out}
.hoopoe.m-happy .crest{transform-origin:124px 66px;animation:crest .5s ease-in-out 2}
.hoopoe.m-sad{animation:droop .5s ease-out forwards}
.bubble{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:14px;line-height:1.5;animation:pop .3s;flex:1}
[dir=rtl] .bubble{border-radius:16px 16px 4px 16px}
.bubble small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.combo{background:var(--gold);color:var(--teal);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;animation:pop .3s}
.flame{display:inline-block;animation:flame 1.2s ease-in-out infinite}
.flashwrap{display:flex;flex-direction:column;gap:12px}
.flip{perspective:900px;border:0;background:none;padding:0;width:100%;cursor:pointer;font:inherit;color:inherit}
.flip .inner{display:block;position:relative;height:230px;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flashwrap.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
.flip .front{background:linear-gradient(180deg,#EAF2EF,#fff);border:1px solid #D6E3DE;box-shadow:0 8px 20px rgba(31,74,85,.08)}
.flip .back{transform:rotateY(180deg);background:var(--teal);color:var(--cream);box-shadow:0 8px 20px rgba(31,74,85,.2)}
.ayahs-sm{font-family:'Amiri Quran','Amiri',serif;font-size:28px;line-height:2}
.ayahs-sm mark{background:var(--gold);color:var(--teal);border-radius:10px;padding:0 6px}
.flip .mean{font-size:28px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted)}
.flash-acts{display:flex;gap:10px;opacity:0;pointer-events:none;transition:opacity .3s}
.flashwrap.on .flash-acts{opacity:1;pointer-events:auto}
.swipearea{position:relative;height:200px;margin-top:12px}
.swipe{position:absolute;inset:0;background:#fff;border:1.5px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;touch-action:none;user-select:none;cursor:grab;box-shadow:0 10px 24px rgba(31,74,85,.1)}
.swipe p{font-size:20px;font-weight:700;margin:0 0 10px;line-height:1.6}
.swipe .lab{position:absolute;top:14px;font-weight:700;font-size:18px;padding:4px 12px;border-radius:10px;border:2.5px solid;opacity:0}
.swipe .yes{right:14px;color:var(--green);transform:rotate(10deg)}
.swipe .no{left:14px;color:var(--rust);transform:rotate(-10deg)}
.swipe.res-ok{border-color:var(--green);background:var(--goodbg);animation:glowok .7s}
.swipe.res-no{border-color:var(--coral);background:#FDECEA;animation:shake .4s}
.tapbox{font-size:30px}
.wbtn{border:0;background:rgba(255,255,255,.6);font:inherit;color:inherit;padding:0 8px;margin:2px;border-radius:12px;cursor:pointer;border-bottom:2px dashed var(--sage);transition:transform .15s}
.wbtn:hover{transform:translateY(-2px)}
.wbtn.sel{background:var(--gold);border-bottom-color:transparent}
.wbtn.right{background:#CFE6DF;border-bottom-color:transparent}
.wbtn.wrong{background:var(--blush);border-bottom-color:transparent;animation:shake .4s}
.chip.big{font-size:18px;padding:10px 18px}
.blank.ok{color:var(--green);border-color:var(--green)}
.blank.no{color:var(--rust);border-color:var(--coral)}
.slots{display:flex;flex-direction:column;gap:10px}
.slotrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.slotrow .w{font-family:'Amiri Quran','Amiri',serif;font-size:22px;text-align:center;background:#EAF2EF;border-radius:12px;padding:4px}
.slot{min-height:50px;border:2px dashed #CDBFAE;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:6px;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s}
.slot.over{border-color:var(--gold);background:#FFF6E5}
.slot.filled{border-style:solid;border-color:var(--green);background:var(--goodbg);color:var(--green);font-weight:600;animation:pop .3s}
.slot.bad{border-color:var(--coral);background:#FDECEA}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;min-height:50px}
.dragchip{border:1.5px solid var(--teal);background:#fff;color:var(--teal);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600;touch-action:none;user-select:none;cursor:grab;box-shadow:0 4px 10px rgba(31,74,85,.1);position:relative}
.dragchip.sel{background:var(--teal);color:var(--cream)}
.dragchip.dragging{z-index:30;box-shadow:0 12px 24px rgba(31,74,85,.25);cursor:grabbing}
.spsec{font-size:26px;min-width:34px;text-align:center;color:var(--rust)}
.speedcard{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:26px 16px;text-align:center;font-size:21px;font-weight:700;animation:pop .25s}
.speedcard.flash-ok{border-color:var(--green)}
.speedcard.flash-no{border-color:var(--coral)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.confetti i{position:absolute;top:0;width:8px;height:13px;border-radius:2px;animation-name:conf;animation-timing-function:linear;animation-fill-mode:forwards}
.lvup{position:absolute;inset:0;z-index:25;background:rgba(23,58,67,.88);display:flex;align-items:center;justify-content:center;overflow:hidden}
.lvup .rays{position:absolute;width:900px;height:900px;background:repeating-conic-gradient(rgba(246,189,96,.16) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite}
.lvbox{position:relative;text-align:center;color:var(--cream);animation:pop .5s;display:flex;flex-direction:column;align-items:center;padding:20px}
.lvt{font-size:28px;font-weight:700;margin:6px 0;color:var(--gold)}
.lvl-burst.big2{width:130px;height:130px;font-size:56px;animation:pop .6s .2s both}

 case 'mode':S.mode=v;break;
 case 'lang':S.lang=v;break;
 case 'pickLang':S.lang=v;S.langChosen=true;S.screen='splash';break;
 case 'go':stopTimer();S.confetti=false;S.screen=v;if(v==='widgetDemo'){S.widget=null;S.notifAns=null;}break;
 case 'toast':case 'ptoast':toast(v);return;
 case 'goal':o.goal=v;break;
 case 'age':o.age=v;break;
 case 'scope':o.scope=v;break;
 case 'sur':var i=o.surahs.indexOf(v);if(i>-1)o.surahs.splice(i,1);else o.surahs.push(v);break;
 case 'juz':o.juz=+v;break;
 case 'min':o.minutes=+v;break;
 case 'pray':o.prayer=+v;break;
 case 'placeStart':startLesson(PLACEMENT,'place');return;
 case 'lessonStart':case 'lessonAgain':startLesson(LESSON,'main');return;
 case 'pick':if(L.checked)return;L.sel=+v;sfx('tick');break;
 case 'swipePick':if(L.checked)return;L.sel=(v==='true');check();return;
 case 'flashKnow':if(!L.flipped){toast(t('اقلب البطاقة أولًا','Flip the card first'));return;}L.xp+=2;if(v==='1'){L.known++;sfx('tick');}var fq=cur();if(v==='0'&&!fq.retry&&L.kind!=='place'){L.queue.push(Object.assign({},fq,{retry:true}));}else L.done++;next();return;
 case 'chipPick':if(SUPPRESS){SUPPRESS=false;return;}L.mt.pick=+v;sfx('tick');break;
 case 'slotPick':if(L.mt.pick===null){toast(t('اختر معنى أولًا ثم اضغط على كلمته','Pick a meaning first, then tap its word'));return;}drop(L.mt.pick,+v);return;
 case 'sp':spAnswer(v);return;
 case 'sound':S.sound=!S.sound;if(S.sound)sfx('tick');break;
 case 'closeLv':S.lvUp=false;break;
 case 'reviewStart':startLesson(REVIEW,'review');return;
 case 'check':check();return;
 case 'next':next();return;
 case 'later':S.screen='popsetup';break;
 case 'social':S.user.phone='social';S.screen='popsetup';break;
 case 'otpOk':if(!/^\d{4}$/.test(S.otp)){toast(t('اكتب ٤ أرقام','Type 4 digits'));return;}S.user.phone=S.user.phone||'set';S.screen='popsetup';break;
 case 'popToggle':S.pop.on=!S.pop.on;break;
 case 'freq':S.pop.freq=+v;break;
 case 'tab':S.tab=v;break;
 case 'lb':S.lb=v;break;
 case 'lbHide':S.lbHide=!S.lbHide;break;
 case 'wid':S.widget=v==='1';if(S.widget)S.user.xp+=2;break;
 case 'notif':S.notifAns=v==='1';if(S.notifAns)S.user.xp+=2;break;
 case 'joined':if(!o.code){toast(t('اكتب كود الفصل','Enter the class code'));return;}o.age=o.age||'8';toast(t('أُرسل طلب الموافقة لوليّ الأمر · انضممت إلى فصل ٥/ب','Approval request sent to your parent · you joined class 5/B'));S.screen='lessonIntro';break;
 case 'role':S.portal.role=v;S.portal.view=v==='admin'?'school':'class';break;
 case 'pview':S.portal.view=v;break;
 case 'stu':S.portal.student=+v;S.portal.view='report';break;
 case 'addAsg':var f=S.portal.form;S.portal.asg.unshift([f.s,f.r,f.d,0]);render();toast(t('أُسند الواجب: سورة '+f.s,'Assigned: Surah '+f.s));return;
 }
 render();
}
var SUPPRESS=false,DR=null;
document.addEventListener('pointerdown',function(e){
 if(!S.L||S.screen!=='lesson')return;
 var sw=e.target.closest('[data-swipe]');
 if(sw&&!S.L.checked){DR={k:'sw',el:sw,x:e.clientX,y:e.clientY};try{sw.setPointerCapture(e.pointerId);}catch(_){}sw.style.transition='none';return;}
 var ch=e.target.closest('[data-chip]');
 if(ch&&!S.L.checked){DR={k:'ch',el:ch,x:e.clientX,y:e.clientY,moved:false,j:+ch.dataset.chip};try{ch.setPointerCapture(e.pointerId);}catch(_){}}
});
document.addEventListener('pointermove',function(e){if(!DR)return;var dx=e.clientX-DR.x,dy=e.clientY-DR.y;
 if(DR.k==='sw'){DR.el.style.transform='translateX('+dx+'px) rotate('+(dx/16)+'deg)';var y=DR.el.querySelector('.yes'),n=DR.el.querySelector('.no');if(y)y.style.opacity=Math.max(0,Math.min(1,dx/90));if(n)n.style.opacity=Math.max(0,Math.min(1,-dx/90));DR.dx=dx;}
 else{if(Math.abs(dx)+Math.abs(dy)>6)DR.moved=true;if(DR.moved){DR.el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.05)';DR.el.classList.add('dragging');var hit=under(DR.el,e.clientX,e.clientY);document.querySelectorAll('.slot.over').forEach(function(x){x.classList.remove('over');});if(hit)hit.classList.add('over');}}
});
function under(el,x,y){el.style.visibility='hidden';var t2=document.elementFromPoint(x,y);el.style.visibility='';return t2&&t2.closest('[data-slot]');}
document.addEventListener('pointerup',function(e){if(!DR)return;var d=DR;DR=null;
 if(d.k==='sw'){var dx=d.dx||0;d.el.style.transition='transform .3s';if(Math.abs(dx)>90){d.el.style.transform='translateX('+(dx>0?500:-500)+'px) rotate('+(dx>0?25:-25)+'deg)';setTimeout(function(){act('swipePick',dx>0?'true':'false');},180);}else{d.el.style.transform='';var y=d.el.querySelector('.yes'),n=d.el.querySelector('.no');if(y)y.style.opacity=0;if(n)n.style.opacity=0;}return;}
 if(d.moved){SUPPRESS=true;setTimeout(function(){SUPPRESS=false;},350);var slot=under(d.el,e.clientX,e.clientY);if(slot){drop(d.j,+slot.dataset.slot);}else{d.el.style.transition='transform .25s';d.el.style.transform='';d.el.classList.remove('dragging');}}
});
document.addEventListener('click',function(e){var f=e.target.closest('[data-flip]');if(!f||!S.L)return;var w=f.closest('.flashwrap');w.classList.toggle('on');S.L.flipped=true;sfx('flip');buzz(10);});
function afterRender(){if(S.mode==='learner'&&S.screen==='lesson'&&S.L&&cur()&&cur().type==='speed'&&!S.L.checked)startSpeed();else if(!(S.screen==='lesson'))stopTimer();}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el||el.disabled)return;act(el.dataset.a,el.dataset.v);});
document.addEventListener('input',function(e){var k=e.target.dataset&&e.target.dataset.in;if(!k)return;var v=e.target.value;
 if(k==='name')S.user.name=v;else if(k==='phone')S.user.phone=v;else if(k==='otp')S.otp=v;else if(k==='code')S.ob.code=v;
 else if(k==='as')S.portal.form.s=v;else if(k==='ar')S.portal.form.r=v;else if(k==='ad')S.portal.form.d=v;});
document.addEventListener('change',function(e){var k=e.target.dataset&&e.target.dataset.in;if(k==='as')S.portal.form.s=e.target.value;if(k==='ad')S.portal.form.d=e.target.value;});
render();
})();
</script>
